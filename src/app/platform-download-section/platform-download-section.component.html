<section class="platform-download">
  <h2 class="title">Clipboard for iOS and Mac OS</h2>
  <p class="description">
    Available for free on the App Store. Download for Mac or iOS, sync with iCloud and you're ready to start adding to your clipboard.
  </p>
  <div class="buttons">
    <button class="ios-button" (click)="onDownloadClicked('ios')">Download for iOS</button>
    <button class="mac-button" (click)="onDownloadClicked('mac')">Download for Mac</button>
  </div>
</section>
